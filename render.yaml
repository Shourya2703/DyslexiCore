services:
  - type: web
    name: dyslexicore-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && chmod +x start.sh
    startCommand: bash start.sh
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "https://frontend-five-fawn-rtv1cmz6k6.vercel.app"
